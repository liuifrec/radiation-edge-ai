[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "radiation-edge-ai"
version = "0.1.0.dev0"
description = "Biologically faithful INT8 edge AI for quantitative radiation microscopy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [{name = "Yu-Chen Liu"}]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
analysis = [
    "Pillow>=9",
]
perilipin2 = [
    "onnx>=1.12",
    "onnxruntime>=1.12",
]
dev = [
    "pytest>=7",
    "ruff>=0.5",
    "Pillow>=9",
]
nasa = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "opencv-python-headless==4.11.0.86",
    "onnx==1.17.0",
    # 1.20.1 has no Python 3.9 wheels. Keep the supported 3.9 stack explicit.
    "onnxruntime==1.19.2; python_version < '3.10'",
    "onnxruntime==1.20.1; python_version >= '3.10'",
]

[project.scripts]
radedge = "radiation_edge_ai.cli:main"
radedge-kl720-check = "radiation_edge_ai.hardware.kl720_check:main"
radedge-nasa = "radiation_edge_ai.nasa_bps.multimodel:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radiation_edge_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
