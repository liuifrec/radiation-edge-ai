[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "radiation-edge-ai"
version = "0.1.0.dev0"
description = "Biologically faithful INT8 edge AI for quantitative radiation microscopy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [{name = "Yu-Chen Liu"}]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.scripts]
radedge-kl720-check = "radiation_edge_ai.hardware.kl720_check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radiation_edge_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
