name: Offline control-plane CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python-version }} offline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install control plane and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Run synthetic and offline tests
        run: python -m pytest -q tests

      - name: Lint changed Python files (historical debt excluded)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            range="${PR_BASE_SHA}...HEAD"
          elif [[ "$WORKFLOW_REF" == 'refs/heads/main' && \
                  "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && \
                  "$EVENT_BEFORE" != '0000000000000000000000000000000000000000' ]]; then
            range="${EVENT_BEFORE}..HEAD"
          else
            range='origin/main...HEAD'
          fi

          echo "Lint baseline: $range"
          changed_file=$(mktemp)
          trap 'rm -f "$changed_file"' EXIT
          git diff --name-only --diff-filter=ACMR -z "$range" -- '*.py' > "$changed_file"
          mapfile -d '' changed < "$changed_file"
          if ((${#changed[@]} == 0)); then
            echo 'No changed Python files to lint.'
          else
            printf 'Checking: %s\n' "${changed[@]}"
            python -m ruff check --select E4,E7,E9,F "${changed[@]}"
          fi
